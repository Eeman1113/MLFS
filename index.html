<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Flipbook Viewer</title>
    <style>
        /* Basic styling for the body and flipbook container */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Container for the flipbook */
        #flipbook-container {
            width: 90vw;
            height: 80vh;
            display: none; /* Hidden until PDF is loaded */
            position: relative;
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        /* Styling for each page (canvas) */
        #flipbook .page {
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        #flipbook .page canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Styling for hardcovers */
        #flipbook .hard {
            background-color: #333;
            background-image: linear-gradient(to right, #444, #222);
            color: white;
            font-size: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Loading and error message styling */
        #loader, #error-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #555;
        }
        
        #loader .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation buttons styling */
        .nav-buttons {
            margin-top: 20px;
            display: none; /* Hidden until PDF is loaded */
        }

        .nav-buttons button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-buttons button:hover {
            background-color: #2980b9;
        }
        
        .nav-buttons button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Loading spinner and status message -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loading-status">Loading PDF viewer...</p>
    </div>

    <!-- Error message container -->
    <div id="error-message" style="display: none;">
        <h2>Could not load PDF</h2>
        <p>Please make sure 'MLFS.pdf' is in the same directory as this HTML file.</p>
    </div>

    <!-- Flipbook container -->
    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <!-- Navigation buttons -->
    <div class="nav-buttons" id="nav-controls">
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
    </div>

    <!-- External Libraries -->
    <!-- Using Google Fonts for a nice, clean font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- jQuery is a dependency for turn.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- pdf.js from Mozilla CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    
    <!-- turn.js for the flipbook effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

    <script>
        // Set the workerSrc for pdf.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        // --- Configuration ---
        const PDF_PATH = './MLFS.pdf';
        const flipbook = $('#flipbook');
        const loader = $('#loader');
        const loadingStatus = $('#loading-status');
        const errorMessage = $('#error-message');
        const flipbookContainer = $('#flipbook-container');
        const navControls = $('#nav-controls');
        const prevBtn = $('#prev-btn');
        const nextBtn = $('#next-btn');


        // --- Main PDF Loading and Rendering Logic ---
        async function loadFlipbook() {
            try {
                loadingStatus.text('Loading PDF file...');
                const pdf = await pdfjsLib.getDocument(PDF_PATH).promise;
                const numPages = pdf.numPages;
                loadingStatus.text(`Rendering ${numPages} pages...`);

                // Render each page and append it to the flipbook
                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const pageDiv = $('<div>').addClass('page').append(canvas);
                    flipbook.append(pageDiv);

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    loadingStatus.text(`Rendered page ${i} of ${numPages}`);
                }

                // Hide loader and show flipbook
                loader.hide();
                flipbookContainer.show();
                navControls.show();

                // Initialize turn.js
                initializeTurnJs(numPages);

            } catch (error) {
                console.error('Error loading PDF:', error);
                loader.hide();
                errorMessage.show();
            }
        }
        
        // --- Turn.js Initialization and Control ---
        function initializeTurnJs(numPages) {
            const containerWidth = flipbookContainer.width();
            const containerHeight = flipbookContainer.height();

            flipbook.turn({
                width: containerWidth,
                height: containerHeight,
                autoCenter: true,
                elevation: 50,
                gradients: true,
                when: {
                    turned: function(event, page, view) {
                        updateNavButtons(page, numPages);
                    }
                }
            });
            
            // Initial button state
            updateNavButtons(1, numPages);

            // Button event listeners
            prevBtn.on('click', () => flipbook.turn('previous'));
            nextBtn.on('click', () => flipbook.turn('next'));

            // Keyboard navigation
            $(document).on('keydown', function(e) {
                if (e.key === "ArrowLeft") {
                    flipbook.turn('previous');
                } else if (e.key === "ArrowRight") {
                    flipbook.turn('next');
                }
            });
            
            // Handle window resizing
            $(window).on('resize', function() {
                const newWidth = flipbookContainer.width();
                const newHeight = flipbookContainer.height();
                flipbook.turn('size', newWidth, newHeight);
            }).trigger('resize');
        }

        // --- UI Helper Functions ---
        function updateNavButtons(currentPage, totalPages) {
            prevBtn.prop('disabled', currentPage === 1);
            nextBtn.prop('disabled', currentPage === totalPages);
        }

        // --- Start the application ---
        $(document).ready(function() {
            loadFlipbook();
        });

    </script>
</body>
</html>
