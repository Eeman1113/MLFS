<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLFS - Machine Learning From Scratch</title>
    <style>
        /* Basic Setup and Background */
        :root {
            /* The book's height is now based on the viewport height to ensure padding */
            --book-height: 90vh; 
            /* The width is calculated from the height to maintain the aspect ratio */
            --book-width: calc(var(--book-height) / 1.414); 
            --background-color: #f0f0f0;
            --dot-color: #d0d0d0;
            --dot-size: 3px;
            --dot-space: 20px;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: var(--background-color);
            background-image: 
                radial-gradient(circle at var(--dot-size) var(--dot-size), 
                var(--dot-color) var(--dot-size), 
                transparent 0);
            background-size: var(--dot-space) var(--dot-space);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Book Container - Now handles clicks */
        .book-container {
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2500px;
            cursor: pointer; /* Indicates the area is clickable */
            user-select: none; /* Prevents text selection when clicking */
            /* Added transition for smooth size changes */
            transition: width 0.5s ease;
        }

        .book {
            display: flex;
            width: calc(var(--book-width) * 2);
            height: var(--book-height);
            transition: transform 0.5s;
        }
        
        /* Style for when the book is showing the single cover page */
        .book.cover-mode {
            width: var(--book-width);
        }

        /* Page Styling */
        .page {
            width: var(--book-width);
            height: var(--book-height);
            background-color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 1s, box-shadow 0.7s;
            transform-origin: left center;
        }
        
        .page.left {
            transform-origin: right center;
            border-right: 1px solid #ccc;
        }
        
        .page.right {
            transform-origin: left center;
            border-left: 1px solid #ccc;
        }

        .page img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none; /* Ensures clicks go to the container */
        }
        
        .hidden {
            display: none;
        }

        /* Responsive Design for smaller screens */
        @media (max-width: 1024px) {
            :root {
                /* On mobile, width is the primary constraint */
                --book-width: 90vw;
                --book-height: calc(var(--book-width) * 1.414);
            }
            .book, .book.cover-mode {
                 width: var(--book-width);
            }
            .page.left {
                display: none; /* On mobile, show one page at a time */
            }
            .page.right {
                border-left: none;
            }
        }

    </style>
</head>
<body>

    <!-- Book Structure -->
    <div class="book-container">
        <div class="book" id="book">
            <div class="page left" id="left-page">
                <img id="left-page-img" src="" alt="Left Page">
            </div>
            <div class="page right" id="right-page">
                <img id="right-page-img" src="" alt="Right Page">
            </div>
        </div>
    </div>

    <!-- Navigation Buttons have been removed -->

    <script>
        // --- CONFIGURATION ---
        const TOTAL_PAGES = 70;
        const PAGE_FILENAME_PREFIX = './book/MLFS_final_page-';
        const PAGE_FILENAME_SUFFIX = '.jpg';
        // ---------------------

        // --- DOM ELEMENTS ---
        const bookContainer = document.querySelector('.book-container');
        const book = document.getElementById('book');
        const leftPage = document.getElementById('left-page');
        const rightPage = document.getElementById('right-page');
        const leftPageImg = document.getElementById('left-page-img');
        const rightPageImg = document.getElementById('right-page-img');

        // --- STATE ---
        // currentPage now tracks the left-most visible page. 1 for cover, 2 for 2-3, 4 for 4-5 etc.
        let currentPage = 1; 

        // --- FUNCTIONS ---

        /**
         * Generates the full image path for a given page number.
         * @param {number} pageNum - The page number.
         * @returns {string} The full image path.
         */
        function getPageImagePath(pageNum) {
            const pageStr = pageNum.toString().padStart(4, '0');
            return `${PAGE_FILENAME_PREFIX}${pageStr}${PAGE_FILENAME_SUFFIX}`;
        }

        /**
         * Updates the book's view based on the currentPage state.
         */
        function updateBookView() {
            const isSinglePageView = window.innerWidth <= 1024;
            
            if (currentPage === 1 && !isSinglePageView) {
                // --- DESKTOP COVER VIEW ---
                book.classList.add('cover-mode');
                leftPage.classList.add('hidden');
                rightPage.classList.remove('hidden');
                rightPageImg.src = getPageImagePath(1);
            } else {
                // --- SPREAD VIEW (Desktop) or SINGLE PAGE VIEW (Mobile) ---
                book.classList.remove('cover-mode');

                if (isSinglePageView) {
                    // --- MOBILE VIEW (Always single page) ---
                    leftPage.classList.add('hidden');
                    rightPage.classList.remove('hidden');
                    rightPageImg.src = getPageImagePath(currentPage);
                } else {
                    // --- DESKTOP SPREAD VIEW ---
                    leftPage.classList.remove('hidden');
                    rightPage.classList.remove('hidden');
                    
                    const leftPageNumber = currentPage;
                    const rightPageNumber = currentPage + 1;

                    leftPageImg.src = getPageImagePath(leftPageNumber);
                    
                    if (rightPageNumber <= TOTAL_PAGES) {
                        rightPageImg.src = getPageImagePath(rightPageNumber);
                        rightPage.classList.remove('hidden');
                    } else {
                        rightPage.classList.add('hidden');
                    }
                }
            }
        }
        
        /**
         * Navigates to the next page or spread.
         */
        function goToNextPage() {
            const isSinglePageView = window.innerWidth <= 1024;

            if (isSinglePageView) {
                if (currentPage < TOTAL_PAGES) currentPage++;
            } else { // Desktop logic
                if (currentPage === 1) {
                    currentPage = 2; // From cover to first spread (pg 2-3)
                } else if (currentPage + 2 <= TOTAL_PAGES) {
                    currentPage += 2; // Go to next spread
                }
            }
            updateBookView();
        }

        /**
         * Navigates to the previous page or spread.
         */
        function goToPrevPage() {
            const isSinglePageView = window.innerWidth <= 1024;

            if (isSinglePageView) {
                if (currentPage > 1) currentPage--;
            } else { // Desktop logic
                if (currentPage === 2) {
                    currentPage = 1; // From first spread back to cover
                } else if (currentPage > 2) {
                    currentPage -= 2; // Go to previous spread
                }
            }
            updateBookView();
        }

        // --- EVENT LISTENERS ---

        // Listen for keyboard arrow keys
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                goToNextPage();
            } else if (e.key === 'ArrowLeft') {
                goToPrevPage();
            }
        });

        // Listen for clicks on the book container
        bookContainer.addEventListener('click', (e) => {
            // On cover, any click goes next
            if (currentPage === 1 && window.innerWidth > 1024) {
                goToNextPage();
                return;
            }

            const rect = bookContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;

            if (clickX > rect.width / 2) {
                goToNextPage();
            } else {
                goToPrevPage();
            }
        });
        
        // Update view on window resize to handle responsive layout changes
        window.addEventListener('resize', updateBookView);

        // --- INITIALIZATION ---
        // Set the initial view when the page loads
        document.addEventListener('DOMContentLoaded', updateBookView);

    </script>
</body>
</html>
